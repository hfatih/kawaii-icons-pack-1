 "🐱", "num": "1999"}, {"f": "icons/icon-2000-pastel-lavender-clouds-stars-timer.png", "filename": "icon-2000-pastel-lavender-clouds-stars-timer.png", "col": "pastel-lavender", "var": "clouds", "sym": "stars-timer", "title": "Stars Timer", "cat": "kawaii", "cat_title": "Kawaii & Özel Simgeler", "cat_icon": "🐱", "num": "2000"}];
  let curCol = 'all';
  let curVar = 'all';
  let curCat = 'all';
  let searchQuery = '';
  
  let filtered = ALL_DATA;
  let page = 1;
  const PAGE_SIZE = 120;
  
  function applyFilters() {
    filtered = ALL_DATA.filter(item => {
      if (curCol !== 'all' && item.col !== curCol) return false;
      if (curVar !== 'all' && item.var !== curVar) return false;
      if (curCat !== 'all' && item.cat !== curCat) return false;
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        const str = (item.title + ' ' + item.sym + ' ' + item.col + ' ' + item.var + ' ' + item.cat_title).toLowerCase();
        if (!str.includes(q)) return false;
      }
      return true;
    });
    page = 1;
    render();
  }
  
  function render() {
    const total = filtered.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    page = Math.min(page, totalPages);
    
    document.getElementById('resultCount').textContent = `Toplam ${total.toLocaleString()} ikon listeleniyor`;
    document.getElementById('pageInfo').textContent = `Sayfa ${page} / ${totalPages}`;
    document.getElementById('prevBtn').disabled = (page <= 1);
    document.getElementById('nextBtn').disabled = (page >= totalPages);
    
    const start = (page - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, total);
    const slice = filtered.slice(start, end);
    
    const grid = document.getElementById('iconsGrid');
    grid.innerHTML = slice.map(item => `
      <div class="card" onclick="copyName('${item.filename}')">
        <img src="${item.f}" loading="lazy" alt="${item.title}">
        <div class="card-title">${item.title}</div>
        <div class="card-meta">${item.col} &bull; ${item.var}</div>
      </div>
    `).join('');
  }
  
  function prevPage() {
    if (page > 1) { page--; render(); window.scrollTo({top: 250, behavior: 'smooth'}); }
  }
  function nextPage() {
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    if (page < totalPages) { page++; render(); window.scrollTo({top: 250, behavior: 'smooth'}); }
  }
  
  function setColor(c, btn) {
    curCol = c;
    updateActive(btn);
    applyFilters();
  }
  function setVariant(v, btn) {
    curVar = v;
    updateActive(btn);
    applyFilters();
  }
  function setCategory(cat, btn) {
    curCat = cat;
    updateActive(btn);
    applyFilters();
  }
  function onSearch() {
    searchQuery = document.getElementById('searchInput').value.trim();
    applyFilters();
  }
  function updateActive(btn) {
    btn.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  
  function copyName(txt) {
    navigator.clipboard.writeText(txt).then(() => {
      const t = document.getElementById('toast');
      t.textContent = `📋 ${txt} kopyalandı!`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    });
  }
  
  applyFilters();
</script>
